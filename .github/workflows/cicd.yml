name: Terraform AKS Deployment (Azure)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: tf-value   # ✅ REQUIRED (your .tf files live here)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: terraform plan -var="resource_group_name=rg-dev-aks"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -var="resource_group_name=rg-dev-aks" -auto-approve


      #- name: Terraform Destroy
       # if: github.event.inputs.action == 'destroy'
       # run: terraform destroy -auto-approve

